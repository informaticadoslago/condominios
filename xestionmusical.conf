 <VirtualHost *:80>
        ServerAdmin admin@doslago.com
        ServerName xestionmusical.virtual.lago
        ServerAlias xestionmusical.virtual.lago xestionmusical.doslago.com
        DirectoryIndex index.php index.html


        RewriteEngine On
        RewriteCond   %{HTTPS} off
        RewriteRule   ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

        <FilesMatch \.php$>
        # For Apache version 2.4.10 and above, use SetHandler to run PHP as a fastCGI process server
          SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
        </FilesMatch>

        LogLevel warn
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/xestionmusical.access.log combined

</VirtualHost>

<IfModule mod_ssl.c>
        <VirtualHost _default_:443>
        ServerName xestionmusical.virtual.lago
        ServerAlias xestionmusical.virtual.lago 
        DirectoryIndex index.php index.html
        DocumentRoot /var/www/xestionmusical/public

                ServerAdmin admin@doslago.com
                SSLEngine on
                SSLCertificateFile      /etc/apache2/ssl/cert.pem
                SSLCertificateKeyFile   /etc/apache2/ssl/key.pem

                <Directory /var/www/xestionmusical/public>
                        Options Indexes FollowSymLinks Includes ExecCGI
                        AllowOverride All
                        Order Deny,Allow
                        Allow from all
                        Require all granted
                </Directory>

		<FilesMatch \.php$>
		      # For Apache version 2.4.10 and above, use SetHandler to run PHP as a fastCGI process server
		      SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
		</FilesMatch>
                LogLevel warn
                ErrorLog ${APACHE_LOG_DIR}/error.log
                CustomLog ${APACHE_LOG_DIR}/xestionmusical.access.log combined
        </VirtualHost>
</IfModule>
